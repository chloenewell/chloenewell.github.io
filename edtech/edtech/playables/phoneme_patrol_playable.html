<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Phoneme Patrol | Playable Prototype</title><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
:root{--navy:#1f3a61;--blue:#368add;--mint:#76d59f;--cream:#f3e3b4;--ink:#183251}*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#dceffc,#f8f1d8);min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #f8bb43;outline-offset:4px}.shell{max-width:1120px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--navy);color:white;border-radius:22px;padding:12px 22px;box-shadow:0 7px 0 #142943}.brand{font-size:clamp(19px,3vw,29px);font-weight:900}.brand span{color:var(--mint)}.stats{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#ffffff1d;border:1px solid #ffffff50;padding:8px 13px;border-radius:40px;font-weight:800}.main{margin-top:22px;background:#fffdf5;border:4px solid white;border-radius:30px;min-height:590px;box-shadow:0 16px 40px #294b6825;overflow:hidden}.screen{padding:30px;text-align:center}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:900;text-transform:uppercase;color:#537393}h1{font-size:clamp(30px,5vw,52px);margin:8px 0 12px;line-height:1.1}h2{font-size:clamp(26px,4vw,38px);margin:10px 0}.sub{font-size:19px;max-width:660px;margin:0 auto 25px;line-height:1.5}.hero-mouse{font-size:94px;filter:drop-shadow(0 12px 4px #0002);margin:10px}.primary{background:var(--blue);color:white;border:0;border-radius:18px;padding:15px 30px;font-weight:900;font-size:21px;box-shadow:0 6px 0 #1d5c9c}.primary:hover{transform:translateY(2px);box-shadow:0 4px 0 #1d5c9c}.secondary{background:white;color:var(--navy);border:3px solid #bfd5e7;border-radius:16px;padding:12px 18px;font-weight:900}.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:850px;margin:25px auto}.path{border:4px solid #dce7f2;border-radius:24px;background:#fff;padding:20px 10px;font-size:22px;font-weight:900;transition:.15s}.path:hover{transform:translateY(-5px);border-color:var(--blue)}.path .scene{display:block;font-size:80px;margin-bottom:10px}.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.progress{height:14px;border-radius:20px;background:#d9e9f2;overflow:hidden;flex:1;min-width:120px}.progress>div{height:100%;background:var(--mint);transition:width .3s}.game-scene{border-radius:25px;max-width:790px;margin:15px auto;padding:23px 15px 25px;background:linear-gradient(#a5d8ff 0%,#e2f7ff 56%,#8ed4a0 57%,#58b775);min-height:170px;position:relative}.game-scene.beach{background:linear-gradient(#9bdcf7 0%,#f5f2d2 55%,#f7d184 56%,#f0c471)}.game-scene.mountain{background:linear-gradient(#a6b9f4 0%,#e4edfa 55%,#9ebca3 56%,#6a9c83)}.game-scene .mouse{font-size:75px}.game-scene .decoration{font-size:58px;position:absolute;right:14%;top:24%}.audio{background:#ecf6ff;border:3px solid #a9d1f3;color:#1b578a;border-radius:20px;padding:13px 23px;font-size:21px;font-weight:900;margin:7px}.audio:hover{background:#d8edff}.letters{display:flex;justify-content:center;gap:clamp(12px,3vw,35px);flex-wrap:wrap;margin:25px 0}.letter{width:clamp(90px,17vw,148px);height:clamp(90px,17vw,148px);border:4px solid #a6c1dc;border-bottom:10px solid #7a9ec2;background:white;border-radius:26px;font-size:clamp(52px,8vw,78px);font-weight:900;color:var(--navy)}.letter:hover{transform:translateY(-4px);border-color:#368add}.letter.correct{background:#c8f6da;border-color:#3caa70}.letter.wrong{background:#ffe0d7;border-color:#d7775f}.confidence{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:800px;margin:25px auto}.conf{border:3px solid #cad8e4;border-radius:20px;padding:18px 10px;background:white;font-size:20px;font-weight:900}.conf span{display:block;font-size:44px;margin-bottom:8px}.conf:hover{border-color:var(--blue)}.feedback{max-width:680px;margin:10px auto;padding:18px;border-radius:20px;background:#ecf8ef;font-size:20px;line-height:1.5}.feedback.help{background:#fff2dc}.town{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px auto}.building{background:white;border:3px solid #e0e8ee;border-radius:20px;width:180px;padding:18px 12px}.building .emoji{font-size:70px}.building.locked{opacity:.45;filter:grayscale(1)}.building strong{display:block;margin:6px}.note{font-size:14px;color:#54728a}.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 5px;color:#52728b;font-size:13px}.hidden{display:none!important}.live{font-weight:800;min-height:26px}.mini{font-size:14px}.results{max-width:640px;margin:18px auto;background:#f0f7ff;border-radius:22px;padding:18px;text-align:left}.results div{padding:8px 0;border-bottom:1px solid #d9e5ee}.results div:last-child{border:0}@media(max-width:650px){.paths,.confidence{grid-template-columns:1fr}.paths{max-width:360px}.path{display:flex;align-items:center;gap:12px;padding:10px}.path .scene{font-size:45px;margin:0}.screen{padding:20px 14px}.top{align-items:flex-start;flex-direction:column}.game-scene .decoration{right:5%}.building{width:145px}}
</style></head><body><div class="shell"><header class="top"><div class="brand">🐭 PHONEME <span>PATROL</span></div><div class="stats"><span class="pill" id="starCount">⭐ 0 stars</span><span class="pill" id="woodCount">🪵 0 materials</span><span class="pill" id="roundCount">🎯 0 / 8</span></div></header><main class="main" id="app" aria-live="polite"></main><footer class="footer"><span>CASE FILE 05 · Playable learning-design concept by Chloé Newell</span><span>Prototype · No accounts, ads, or tracking · Audio uses your browser's voice</span></footer></div><script>
const app=document.getElementById('app');
const bank=[{l:'M',sound:'/m/',speech:'mmm',cue:'Like the beginning of moon.',choices:['M','S','T']},{l:'S',sound:'/s/',speech:'ssss',cue:'Like a snake: ssss.',choices:['F','S','M']},{l:'A',sound:'/ă/',speech:'aah',cue:'The short a sound, like apple.',choices:['A','O','E']},{l:'T',sound:'/t/',speech:'tuh',cue:'A quick /t/ sound, like top.',choices:['P','T','D']},{l:'F',sound:'/f/',speech:'ffff',cue:'Feel the air: ffff, like fish.',choices:['V','F','S']},{l:'P',sound:'/p/',speech:'puh',cue:'A quick puff of air: /p/, like pig.',choices:['P','B','T']},{l:'N',sound:'/n/',speech:'nnnn',cue:'Like the beginning of nest.',choices:['M','N','L']},{l:'I',sound:'/ĭ/',speech:'ih',cue:'Short i, like igloo.',choices:['E','I','A']}];
let state={screen:'home',path:'forest',round:0,stars:0,wood:0,correct:0,guess:0,hints:0,queue:[],current:null,selected:null,confidence:null,events:[],mistakes:{},lastCorrect:false,practice:0};
const icons={forest:'🌲',beach:'🏖️',mountain:'🏔️'};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stats(){document.getElementById('starCount').textContent=`⭐ ${state.stars} stars`;document.getElementById('woodCount').textContent=`🪵 ${state.wood} materials`;document.getElementById('roundCount').textContent=`🎯 ${Math.min(state.round,8)} / 8`;}
function render(){stats();let s=state;if(s.screen==='home')app.innerHTML=`<section class="screen"><div class="eyebrow">A phonics adventure for curious explorers · Ages 4–6</div><div class="hero-mouse" aria-hidden="true">🐭🧭</div><h1>Help rebuild the<br>Adventure Village!</h1><p class="sub">Listen for sounds, find the matching letters, and collect materials to build something amazing. Every little win counts!</p><button class="primary" onclick="go('paths')">Let's explore! →</button><p class="note">Sound on recommended 🔊</p></section>`;
else if(s.screen==='paths')app.innerHTML=`<section class="screen"><div class="eyebrow">Your adventure, your choice</div><h1>Where should we explore?</h1><p class="sub">Choose any path. The learning stays the same, but the adventure is yours!</p><div class="paths">${Object.entries(icons).map(([k,v])=>`<button class="path" onclick="choosePath('${k}')"><span class="scene">${v}</span>${k[0].toUpperCase()+k.slice(1)} Trail</button>`).join('')}</div></section>`;
else if(s.screen==='play')app.innerHTML=`<section class="screen"><div class="game-top"><span class="eyebrow">${icons[s.path]} ${s.path.toUpperCase()} TRAIL</span><div class="progress" aria-label="Adventure progress"><div style="width:${s.round/8*100}%"></div></div><span class="mini">Challenge ${s.round+1} of 8</span></div><div class="game-scene ${s.path}"><span class="mouse" aria-hidden="true">🐭</span><span class="decoration" aria-hidden="true">${icons[s.path]}</span></div><h2>Find the letter that makes this sound!</h2><button class="audio" onclick="speak()" aria-label="Hear the sound again">🔊 Tap to hear the sound</button><p class="note">Listen carefully, then choose a letter.</p><div class="letters">${s.current.choices.map(c=>`<button class="letter" onclick="answer('${c}')" aria-label="Letter ${c}">${c}</button>`).join('')}</div><div class="live" id="announce" role="status"></div></section>`;
else if(s.screen==='confidence')app.innerHTML=`<section class="screen"><div class="eyebrow">A little thinking moment</div><div class="hero-mouse" aria-hidden="true">🐭💭</div><h1>How did you know?</h1><p class="sub">All answers are okay. Tell us how you felt when you chose your letter.</p><div class="confidence"><button class="conf" onclick="setConfidence('know')"><span>😄</span>I knew it!</button><button class="conf" onclick="setConfidence('think')"><span>🙂</span>I think so...</button><button class="conf" onclick="setConfidence('guess')"><span>🤔</span>I guessed!</button></div><p class="note">There is no wrong choice here.</p></section>`;
else if(s.screen==='feedback'){let c=s.lastCorrect,conf=s.confidence;let title=c?(conf==='guess'?'Great try, explorer!':conf==='think'?'You figured it out!':'You got it!'):'Good effort, explorer!';let desc=c?(conf==='guess'?`You found <b>${s.current.l}</b>! We'll practice that sound again soon so it feels easier.`:`The letter <b>${s.current.l}</b> makes the sound <b>${s.current.sound}</b>. You earned a star and building materials!`):`The sound <b>${s.current.sound}</b> matches <b>${s.current.l}</b>. ${s.current.cue} Let's hear it together.`;app.innerHTML=`<section class="screen"><div class="hero-mouse" aria-hidden="true">${c?'🐭🎉':'🐭💙'}</div><h1>${title}</h1><div class="feedback ${c?'':'help'}">${desc}</div><button class="audio" onclick="speak()">🔊 Hear ${s.current.sound} again</button><p class="sub">${c?'⭐ +1 star &nbsp; 🪵 +3 materials':'💛 You can learn from every try!'}</p><button class="primary" onclick="next()">${s.round===7?'See my village!':'Keep exploring →'}</button></section>`;}
else if(s.screen==='village'){let unlocked=[s.wood>=9,s.wood>=18,s.wood>=24];app.innerHTML=`<section class="screen"><div class="eyebrow">Adventure village · Your progress matters</div><h1>Look what you helped build! 🎉</h1><p class="sub">Your practice is helping the village grow. Every sound you learn makes a difference.</p><div class="town"><div class="building ${unlocked[0]?'':'locked'}"><div class="emoji">🌉</div><strong>Bridge</strong><span>${unlocked[0]?'Built!':'9 materials needed'}</span></div><div class="building ${unlocked[1]?'':'locked'}"><div class="emoji">🏫</div><strong>Library</strong><span>${unlocked[1]?'Built!':'18 materials needed'}</span></div><div class="building ${unlocked[2]?'':'locked'}"><div class="emoji">🌳</div><strong>Treehouse</strong><span>${unlocked[2]?'Built!':'24 materials needed'}</span></div></div><div class="results"><div>⭐ <b>${s.stars}</b> sounds answered correctly</div><div>🪵 <b>${s.wood}</b> building materials earned</div><div>🧠 <b>${s.guess}</b> honest “I guessed” check-ins</div><div>🔁 <b>${s.practice}</b> extra practice opportunities scheduled</div><div>💡 <b>${s.hints}</b> scaffolded learning moments</div></div><button class="primary" onclick="restart()">Play another adventure ↻</button><button class="secondary" style="margin:10px" onclick="downloadReport()">↓ Download prototype event log</button><p class="note">Illustrative progress from this session only. This is not research or validated outcome data.</p></section>`;}
}
function go(p){state.screen=p;render()}
function choosePath(p){state.path=p;state.screen='play';state.queue=bank.slice();state.current=state.queue[0];render();setTimeout(speak,350)}
function speak(){if(!state.current)return;if(!('speechSynthesis'in window)){let el=document.getElementById('announce');if(el)el.textContent='Audio unavailable on this browser. Ask an adult to say '+state.current.sound;return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(state.current.speech);u.rate=.72;u.pitch=1.15;u.lang='en-US';speechSynthesis.speak(u)}
function answer(letter){if(state.screen!=='play')return;state.selected=letter;state.lastCorrect=letter===state.current.l;state.events.push({event:'answer',round:state.round+1,target:state.current.l,selected:letter,correct:state.lastCorrect,at:new Date().toISOString()});state.screen='confidence';render()}
function setConfidence(c){if(state.screen!=='confidence')return;state.confidence=c;state.events.push({event:'confidence',round:state.round+1,value:c,correct:state.lastCorrect});if(state.lastCorrect){state.correct++;state.stars++;state.wood+=3}else{state.hints++;state.mistakes[state.current.l]=(state.mistakes[state.current.l]||0)+1}if(c==='guess')state.guess++;if(!state.lastCorrect||c==='guess'){let idx=Math.min(state.round+3,7);if(idx>state.round+1&&idx<state.queue.length){state.queue.splice(idx,0,{...state.current,repeat:true});state.practice++}}state.screen='feedback';render()}
function next(){state.round++;if(state.round>=8){state.screen='village'}else{state.current=state.queue[state.round]||bank[state.round%bank.length];state.screen='play'}render();if(state.screen==='play')setTimeout(speak,250)}
function restart(){state={screen:'paths',path:'forest',round:0,stars:0,wood:0,correct:0,guess:0,hints:0,queue:[],current:null,selected:null,confidence:null,events:[],mistakes:{},lastCorrect:false,practice:0};render()}
function downloadReport(){const payload={prototype:'Phoneme Patrol',disclaimer:'Local illustrative session data only. Not validated analytics.',path:state.path,stars:state.stars,wood:state.wood,events:state.events};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='phoneme-patrol-session.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();
</script></body></html>
