<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRENCH RUN | Cause & Effect Mission</title><style>
:root{--bg:#080b1d;--panel:#11172f;--cyan:#58f5ff;--purple:#aa77ff;--text:#f3f4ff;--muted:#a7b0d2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#25204c,#080b1d 68%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;gap:12px;flex-wrap:wrap}.logo{font-weight:950;letter-spacing:.19em;font-size:22px}.logo span{color:var(--cyan)}.tag{font-size:11px;letter-spacing:.16em;color:var(--muted)}.hud{display:flex;gap:15px;flex-wrap:wrap;font-size:12px}.hud strong{color:var(--cyan)}main{max-width:1200px;margin:auto;padding:0 16px 24px}.game{position:relative;border:1px solid #4e528d;border-radius:18px;overflow:hidden;box-shadow:0 0 60px #5637ad44;background:#080c1c}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}.overlay{position:absolute;inset:0;background:#070c20d9;display:flex;justify-content:center;align-items:center;padding:18px;overflow-y:auto}.overlay.hidden{display:none}.modal{width:min(680px,100%);max-height:100%;overflow:auto;border:1px solid #7562c5;background:linear-gradient(145deg,#182044,#10152c);box-shadow:0 20px 70px #0009,0 0 28px #8059f344;border-radius:18px;padding:clamp(18px,3vw,34px)}.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--cyan);font-weight:800}.modal h1{font-size:clamp(25px,4vw,40px);line-height:1.1;margin:12px 0}.modal h2{font-size:clamp(22px,3vw,30px);margin:10px 0}.modal p{line-height:1.55;color:#d9dff5}.cipher{display:flex;gap:12px;align-items:start;background:#0b1533;border-left:3px solid var(--cyan);padding:13px;border-radius:8px;margin:15px 0}.avatar{background:#25365c;border:1px solid var(--cyan);color:var(--cyan);padding:10px;border-radius:9px;font-weight:900}.cipher p{margin:0}.options{display:grid;gap:9px;margin:15px 0}.option{width:100%;text-align:left;background:#222a50;color:white;border:1px solid #5a6194;padding:13px 15px;border-radius:10px;font:inherit;cursor:pointer}.option:hover,.option:focus-visible{border-color:var(--cyan);background:#293961}.option.correct{border-color:#69ffc8;background:#145145}.option.wrong{border-color:#ff7aab;background:#632644}button.primary{border:0;background:linear-gradient(90deg,#5af2ff,#ac8aff);color:#091022;padding:13px 22px;border-radius:10px;font-weight:900;letter-spacing:.06em;cursor:pointer}button.primary:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}.feedback{font-size:14px;min-height:20px;color:#80ffcd}.muted{color:var(--muted);font-size:13px}.controls{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;color:#c8d0ed;font-size:13px}.touch{display:flex;gap:9px}.touch button{border:1px solid #6370ae;background:#18234a;color:white;border-radius:10px;padding:12px 20px;font-weight:900;touch-action:none;cursor:pointer}.progress{height:5px;background:#252c4e}.progress>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));width:0;transition:width .3s}.small{font-size:12px;color:#b9c3df}kbd{background:#222b4e;padding:3px 7px;border-radius:5px}@media(max-width:650px){.hud{gap:9px}.overlay{padding:9px}.modal{padding:16px}.modal p{font-size:13px}.option{padding:10px}.logo{font-size:18px}}
</style></head><body><header><div><div class="logo">TRENCH<span>RUN</span></div><div class="tag">THE CAUSE & EFFECT PROTOCOL • PLAYABLE VERTICAL SLICE</div></div><div class="hud"><div>MISSION <strong id="mission">01 / 07</strong></div><div>DATA <strong id="score">0000</strong></div><div>SHIELDS <strong id="shields">♥ ♥ ♥</strong></div></div></header><main><div class="game"><div class="progress"><div id="progress"></div></div><canvas id="scene" width="1120" height="630" aria-label="Futuristic three-lane running game"></canvas><div id="overlay" class="overlay"><section id="modal" class="modal"></section></div></div><div class="controls"><div>MOVE <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> • <kbd>SPACE</kbd> to select a nearby node • <kbd>P</kbd> to pause</div><div class="touch"><button id="left" aria-label="Move left">◀</button><button id="action" aria-label="Select node">SELECT</button><button id="right" aria-label="Move right">▶</button></div></div><p class="small">Original educational gameplay concept by Chloe Newell • Local standalone demo • Designed for keyboard, mouse, and touch</p></main><script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),modal=document.getElementById('modal');const $=id=>document.getElementById(id);let stage=0,score=0,shields=3,lane=1,running=false,paused=false,items=[],spawnClock=0,last=0,elapsed=0,task=null,answered=false,runCount=0,runGoal=0,runMode='',runEvents=[],selected=[],feedbackTimer=0;const stages=['Spawn Bay','I DO · Model','Chain Reaction Run','WE DO · Guided','Driftline Chase','YOU DO · Independent','The Core'];const passage='In 1963, an underwater volcano erupted near Iceland. Lava and ash rose above the ocean. Over time, the material cooled and formed a new island called Surtsey. Because the island was new, scientists could study how plants and animals arrived there.';
function hud(){ $('mission').textContent=String(Math.min(stage+1,7)).padStart(2,'0')+' / 07';$('score').textContent=String(score).padStart(4,'0');$('shields').textContent='♥ '.repeat(Math.max(0,shields));$('progress').style.width=(stage/7*100)+'%'}
function show(html){running=false;overlay.classList.remove('hidden');modal.innerHTML=html;hud()}function hide(){overlay.classList.add('hidden');running=true;last=performance.now();requestAnimationFrame(loop)}function cipher(msg){return `<div class="cipher"><div class="avatar">C</div><p><b style="color:#5cf4ff">CIPHER // MISSION GUIDE</b><br>${msg}</p></div>`}function button(label,fn='next()'){return `<div class="actions"><button class="primary" onclick="${fn}">${label}</button></div>`}function reset(){stage=0;score=0;shields=3;lane=1;selected=[];items=[];hud();renderStage()}
function renderStage(){hud();if(stage===0)show(`<div class="eyebrow">MISSION BRIEF // SPAWN BAY</div><h1>Restore the Knowledge Core.</h1><p>A data storm scrambled the science archive. Run through the trench, recover the evidence, and rebuild the chain of <b>cause and effect</b>.</p>${cipher('Runner, a cause tells us <b>why</b> something happens. An effect tells us <b>what happened as a result</b>. Ready to trace the signal?')}<p class="muted">7 mission segments • Approximately 5 minutes • Designed for grade 4 reading comprehension</p>${button('INITIATE MISSION')}`);
else if(stage===1)show(`<div class="eyebrow">STAGE 02 // I DO</div><h2>Watch Cipher decode the signal</h2><p style="border:1px solid #57648b;padding:13px;border-radius:8px">${passage}</p>${cipher('Watch my thinking: <b>The underwater volcano erupted</b> is the cause. <b>Lava and ash rose above the ocean</b> is an effect. The words “because” and “as a result” can help us connect events.')}<div class="small">CAUSE → EFFECT<br>🌋 Volcano erupts → 🌊 Lava and ash rise → 🏝️ New island forms</div>${button('ENTER CHAIN REACTION RUN')}`);
else if(stage===2)startRun('chain');else if(stage===3)question('WE DO · GUIDED PRACTICE','Why were scientists able to study how plants and animals first arrived on Surtsey?',['Because the island was newly formed','Because the island had many cities','Because the volcano was underwater forever'],0,'The new island gave scientists a chance to observe how life first arrived.');else if(stage===4)startRun('drift');else if(stage===5)question('YOU DO · INDEPENDENT','Which sentence best explains a cause-and-effect relationship in the passage?',['Scientists visited Iceland because they liked the weather.','Lava and ash cooled, so a new island formed.','Animals made the volcano erupt.'],1,'Cooling volcanic material helped create the island.');else if(stage===6)show(`<div class="eyebrow">FINAL STAGE // THE CORE</div><h1>Mission complete.</h1>${cipher('The evidence chain is restored. You identified causes, tracked effects, and defended your reasoning using text evidence.')}<h2 style="color:#5cf4ff">${score} DATA POINTS</h2><p>Shields remaining: ${shields} / 3</p><p>Achievement unlocked: <b>CHAIN REACTION ANALYST</b></p>${button('PLAY AGAIN','reset()')}`)}
function next(){stage++;renderStage()}
function question(kicker,q,opts,correct,explanation){answered=false;show(`<div class="eyebrow">${kicker}</div><h2>Decode the evidence</h2><p>${q}</p><div class="options">${opts.map((o,i)=>`<button class="option" id="opt${i}" onclick="answer(${i},${correct},'${explanation.replaceAll("'","\\'")}')">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button id="continue" class="primary" disabled onclick="next()">CONTINUE MISSION</button></div>`)}
function answer(i,c,exp){if(answered)return;document.querySelectorAll('.option').forEach((el,j)=>{el.disabled=true;if(j===c)el.classList.add('correct');if(j===i&&i!==c)el.classList.add('wrong')});answered=true;if(i===c){score+=150;$('feedback').textContent='✓ Signal confirmed. '+exp}else{$('feedback').textContent='Cipher: Not quite. '+exp} $('continue').disabled=false;hud()}
function startRun(mode){runMode=mode;items=[];elapsed=0;spawnClock=0;runCount=0;selected=[];runEvents=mode==='chain'?[{label:'Volcano erupts',icon:'🌋',id:0},{label:'Lava rises',icon:'🔥',id:1},{label:'Island forms',icon:'🏝️',id:2}]:[{label:'New island forms',icon:'🏝️',id:0},{label:'Scientists observe life',icon:'🔬',id:1}];runGoal=runEvents.length;show(`<div class="eyebrow">${mode==='chain'?'STAGE 03 // CHAIN REACTION RUN':'STAGE 05 // DRIFTLINE CHASE'}</div><h2>${mode==='chain'?'Collect the events in order':'Chase the cause-and-effect nodes'}</h2>${cipher(mode==='chain'?'Steer into the glowing nodes in the correct order: <b>volcano erupts → lava rises → island forms</b>. Avoid red firewalls.':'The island forms first. Scientists can then study the arrival of life. Collect both nodes in order and avoid the firewalls.')}<p>Use <b>← / →</b> to switch lanes. The glowing target is labeled with the next event. A wrong node or firewall costs one shield.</p>${button('RUN','beginRun()')}`)}function beginRun(){items=[];spawnClock=0;hide()}function fail(){shields--;hud();if(shields<=0){show(`<div class="eyebrow">SIGNAL LOST</div><h2>Shields depleted</h2>${cipher('Every Runner can recalibrate. Let’s retry this section and look carefully at the order of events.')} ${button('RETRY SECTION','retry()')}`)}}function retry(){shields=3;startRun(runMode)}
function move(dir){if(!running||paused)return;lane=Math.max(0,Math.min(2,lane+dir))}function collect(it){if(it.kind==='wall'){fail();return}if(it.id===runCount){score+=100;runCount++;hud();if(runCount>=runGoal){running=false;show(`<div class="eyebrow">SECTION CLEARED</div><h2>Chain restored!</h2>${cipher('Excellent. Each event leads to the next. The evidence now tells a complete story.')}<p style="color:#7bffd6">+${runGoal*100} data points earned</p>${button('NEXT STAGE')}`)}}else fail()}
function select(){if(!running)return;const near=items.find(it=>it.lane===lane&&it.z>.75&&!it.hit);if(near){near.hit=true;collect(near)}}document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','ArrowUp'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if(e.key===' ')select();if(e.key.toLowerCase()==='p'&&running){paused=!paused;if(!paused){last=performance.now();requestAnimationFrame(loop)}else draw()}});$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('action').onclick=select;
function poly(points,fill,stroke,width=1){ctx.beginPath();ctx.moveTo(...points[0]);points.slice(1).forEach(p=>ctx.lineTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}function draw(){const w=1120,h=630;ctx.clearRect(0,0,w,h);const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#090d29');bg.addColorStop(.6,'#171342');bg.addColorStop(1,'#050c22');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);for(let i=0;i<70;i++){let x=(i*173+43)%w,y=(i*97+23)%340;ctx.fillStyle=i%3?'#8b8be666':'#59f2ff99';ctx.fillRect(x,y,2,2)}const hz=160;ctx.strokeStyle='#8052f466';ctx.lineWidth=2;for(let k=0;k<12;k++){let t=((k/12+elapsed*.25)%1);let y=hz+(h-hz)*t*t;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}poly([[370,hz],[750,hz],[1120,h],[0,h]],'#121b43','#6d57d6',3);for(let i=0;i<=3;i++){let x0=370+i*380/3,x1=i*w/3;ctx.beginPath();ctx.moveTo(x0,hz);ctx.lineTo(x1,h);ctx.strokeStyle='#54f3ff88';ctx.lineWidth=3;ctx.stroke()}for(let i=0;i<15;i++){let t=((i/15+elapsed*.4)%1),y=hz+(h-hz)*t*t,edge=(w/2)*(1-t);ctx.strokeStyle='#7b4bd555';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.fillStyle='#7d69ee';ctx.font='bold 14px monospace';ctx.fillText('THE TRENCH // '+(stages[stage]||'CORE'),26,36);ctx.fillStyle='#69faff';ctx.fillText('NEXT SIGNAL: '+(runEvents[runCount]?.label||'STANDBY'),26,62);items.slice().sort((a,b)=>a.z-b.z).forEach(it=>{let t=Math.max(0,Math.min(1,it.z)),y=hz+465*t*t,x=560+(it.lane-1)*(127+230*t),s=15+35*t;ctx.shadowColor=it.kind==='wall'?'#ff4a87':'#5ef5ff';ctx.shadowBlur=25;poly([[x,y-s],[x+s,y],[x,y+s],[x-s,y]],it.kind==='wall'?'#a72d69':'#1c9fbd',it.kind==='wall'?'#ff729e':'#8affff',3);ctx.shadowBlur=0;ctx.font=`bold ${Math.round(11+7*t)}px system-ui`;ctx.textAlign='center';ctx.fillStyle='white';ctx.fillText(it.kind==='wall'?'FIREWALL':it.label,x,y+s+23);ctx.textAlign='left'});let px=560+(lane-1)*310,py=555;ctx.shadowColor='#63faff';ctx.shadowBlur=28;poly([[px,py-52],[px+33,py+37],[px,py+15],[px-33,py+37]],'#4edcff','#d2ffff',3);ctx.shadowBlur=0;ctx.fillStyle='#a47aff';ctx.fillRect(px-12,py+30,24,25);ctx.textAlign='center';ctx.font='bold 14px monospace';ctx.fillStyle='#e4eaff';ctx.fillText('RUNNER',px,py-65);ctx.textAlign='left';if(paused){ctx.fillStyle='#000a';ctx.fillRect(0,0,w,h);ctx.textAlign='center';ctx.font='bold 45px system-ui';ctx.fillStyle='white';ctx.fillText('PAUSED',w/2,h/2);ctx.textAlign='left'}}
function loop(now){if(!running||paused)return;let dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;spawnClock+=dt;if(spawnClock>2.05){spawnClock=0;let id=runCount,kind=Math.random()<.18?'wall':'node';items.push({kind,lane:Math.floor(Math.random()*3),id,z:0,hit:false})}for(let it of items){it.z+=dt*.43;if(!it.hit&&it.z>=.93&&it.lane===lane){it.hit=true;collect(it);if(!running)return}}items=items.filter(it=>it.z<1.18);draw();requestAnimationFrame(loop)}
renderStage();draw();
</script></body></html>
